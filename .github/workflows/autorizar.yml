name: Autorizar TikTok

on:
  workflow_dispatch:
    inputs:
      url_retorno:
        description: '1ª vez: deixe vazio para gerar o link. 2ª vez: cole a URL copiada da página "Autorização recebida".'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  autorizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Autorizar
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
          URL_RETORNO: ${{ inputs.url_retorno }}
        run: node bin/autorizar-ci.js
      - name: Conferir a conta conectada
        if: inputs.url_retorno != ''
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
        run: node bin/postar.js --info
      - name: Salvar tokens criptografados
        if: inputs.url_retorno != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add tokens.enc
          git diff --cached --quiet || (git commit -m "Atualiza autorização do TikTok" && git push)
