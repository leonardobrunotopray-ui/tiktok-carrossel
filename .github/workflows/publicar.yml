name: Publicar no TikTok

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: 'Pasta do post em posts/ (deixe vazio para publicar o próximo da fila)'
        required: false
        default: ''
      teste:
        description: 'Só testar, sem publicar'
        type: boolean
        default: false
  # Agendamento: todo dia às 18:30 (Brasília) = 21:30 UTC, para publicar por volta das 19h.
  # 19:15 (22:15 UTC) é reserva, caso o GitHub atrase ou pule o primeiro horário.
  # Sai no máximo 1 post por dia: se o primeiro funcionar, a reserva não envia nada.
  schedule:
    - cron: '30 21 * * *'
    - cron: '15 22 * * *'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar imagens a partir do texto (se precisar)
        run: |
          if node bin/gerar.js --verificar; then
            npm install --no-save playwright@1.49.1
            npx playwright install --with-deps chromium
            node bin/gerar.js
          fi
      - name: Salvar imagens geradas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Gera imagens dos carrosséis" && git push)
      - name: Atualizar lista de posts do site
        run: node bin/indice.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  site:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  publicar:
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atualizar dados da conta (para a tela de aprovação)
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
        run: node bin/postar.js --info > /dev/null
      - name: Publicar carrossel
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
          PASTA: ${{ inputs.pasta }}
          EVENTO: ${{ github.event_name }}
          TESTE: ${{ inputs.teste }}
        run: |
          FLAG=""
          [ "$TESTE" = "true" ] && FLAG="--dry-run"
          if [ -n "$PASTA" ]; then
            node bin/postar.js "$PASTA" $FLAG
          else
            node bin/postar.js --proxima $FLAG
          fi
      - name: Salvar status e token renovado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          for f in posts tokens.enc conta.json; do if [ -e "$f" ]; then git add -A -- "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Atualiza status da publicação" && git pull --rebase && git push)
          # Commits do robô não disparam o site sozinhos: pede a atualização.
          gh workflow run site.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}
