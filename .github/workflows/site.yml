name: Atualizar site

# Publica o GitHub Pages (páginas do app e imagens dos posts) sempre que algo muda no main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar imagens de posts novos (se precisar)
        run: |
          if node bin/gerar.js --verificar; then
            npm install --no-save playwright@1.49.1
            npx playwright install --with-deps chromium
            node bin/gerar.js
          fi
      - name: Atualizar lista de posts
        run: node bin/indice.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  site:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
